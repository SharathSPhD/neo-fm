title = "neo-fm gitleaks config"

[extend]
useDefault = true

[allowlist]
# mobile-android.yml:114 references a secret by NAME (secrets.X), no value; one exact commit, so later edits are still scanned.
commits = ["b23142c7a1dc0a1c1c19306439cc552c7517402b"]
description = "Test fixtures and lockfiles carry fake or public values"
paths = [
  '''pnpm-lock\.yaml$''',
  '''uv\.lock$''',
  '''(^|/)tests?/''',
  '''\.test\.[cm]?[jt]sx?$''',
  '''(^|/)node_modules/''',
  # Runbook with `Bearer YOUR_CRON_SECRET` placeholders.
  '''MANUAL-STEPS\.md$''',
  # `key=` here is a corpus-source id (e.g. "indictts-kn"), not a credential.
  '''services/vocal-synth/scripts/curate_kannada_tts\.py$''',
]
