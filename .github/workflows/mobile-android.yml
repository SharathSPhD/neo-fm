name: mobile-android

on:
  push:
    tags: ["mobile-v*"]
  pull_request:
    paths: ["apps/mobile/**", ".github/workflows/mobile-android.yml"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a GitHub prerelease with this tag (e.g. mobile-v0.1.0); leave empty to only build"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: mobile-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: debug-signed beta APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm --filter @neo-fm/mobile typecheck
      - name: Add the Firebase config (when its secret exists)
        env:
          GS_B64: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_B64 }}
        run: |
          if [ -z "$GS_B64" ]; then echo "no Firebase config: native push stays off"; exit 0; fi
          echo "$GS_B64" | base64 -d > apps/mobile/android/app/google-services.json
      - name: Sync and build
        working-directory: apps/mobile
        run: |
          npx cap sync android
          cd android && ./gradlew assembleDebug --no-daemon
      - name: Name the APK
        run: cp apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk neo-fm-beta.apk
      - name: Sign with the stable beta key (when its secrets exist)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # A stable key lets a phone update the beta in place. Without the secrets (forks, PRs from forks) the APK stays debug-signed.
          if [ -z "$KS_B64" ]; then echo "no beta key secrets: keeping the debug signature"; exit 0; fi
          APKSIGNER="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          KS="$RUNNER_TEMP/beta.p12"
          echo "$KS_B64" | base64 -d > "$KS"
          KS_PASS="$KS_PASS" KEY_PASS="$KEY_PASS" "$APKSIGNER" sign --ks "$KS" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KS_PASS --key-pass env:KEY_PASS neo-fm-beta.apk
          "$APKSIGNER" verify --print-certs neo-fm-beta.apk | grep -i "SHA-256 digest" | head -1
          rm -f "$KS"
      - uses: actions/upload-artifact@v4
        with:
          name: neo-fm-beta-apk
          path: neo-fm-beta.apk

  release:
    name: attach APK to the GitHub Release
    if: startsWith(github.ref, 'refs/tags/mobile-v') || github.event.inputs.release_tag != ''
    needs: [apk, emulator-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: neo-fm-beta-apk
      - name: Create release and upload
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.inputs.release_tag || github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --target "$GITHUB_SHA" --prerelease --title "neo-fm beta $TAG" --notes "Beta APK for sideloading. Allow 'install unknown apps' for your browser, then open the file."
          gh release upload "$TAG" neo-fm-beta.apk --clobber

  emulator-smoke:
    name: emulator smoke
    needs: apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: neo-fm-beta-apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@c9c93e6ba9c4194322e114c40970d5983d9a07cc # v2.38.0
        env:
          FCM_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.FCM_SERVICE_ACCOUNT_JSON_B64 }}
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          script: bash apps/mobile/scripts/emulator-smoke.sh neo-fm-beta.apk smoke-out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-smoke-evidence
          path: smoke-out/
          if-no-files-found: ignore
