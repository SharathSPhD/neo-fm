name: e2e (preview)

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Preview or production URL to test (https://...)"
        required: true
      slow:
        description: "Run the slow create-song journey (spends Claude + Lyria budget)"
        type: boolean
        default: false
  schedule:
    - cron: "30 21 * * *" # nightly, against the URL in repo variable E2E_BASE_URL

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      E2E_BASE_URL: ${{ inputs.base_url || vars.E2E_BASE_URL }}
      E2E_SHARE_TOKEN: ${{ secrets.E2E_SHARE_TOKEN }}
      E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
      E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
      E2E_SLOW: ${{ (inputs.slow || github.event_name == 'schedule') && '1' || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm --filter @neo-fm/web exec playwright install --with-deps chromium
      - name: playwright
        run: pnpm --filter @neo-fm/web exec playwright test
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: |
            apps/web/tests/e2e/.playwright-report
            apps/web/tests/e2e/.playwright-output
