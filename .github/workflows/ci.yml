name: ci

on:
  push:
    branches: [main, release-v2, "claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ts:
    name: typescript (pnpm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile=false

      - run: pnpm -r typecheck

      - run: pnpm -r --if-present lint

      - run: pnpm -r --if-present test

      - run: pnpm --filter @neo-fm/web build

  secret-scan:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (full history, pinned)
        run: |
          set -euo pipefail
          V=8.21.2
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${V}/gitleaks_${V}_linux_x64.tar.gz" -o gl.tgz
          tar -xzf gl.tgz gitleaks
          ./gitleaks detect --source . --config .gitleaks.toml --redact --no-banner --exit-code 1

  migration-security:
    name: migration security lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Fails on: table without RLS, SECURITY DEFINER without search_path or revoke, view without `revoke ... from anon`.
      - run: node scripts/check-migrations-security.mjs
      - run: node --test scripts/tests/check-migrations-security.test.mjs

  rls-audit:
    name: rls audit (anon + authenticated vs other users' rows)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust   # throwaway CI database, no password
          POSTGRES_DB: rls_audit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rls_audit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RLS_AUDIT_DB_URL: postgresql://postgres@localhost:5432/rls_audit
    steps:
      - uses: actions/checkout@v4
      # Applies every migration to a throwaway Postgres (Supabase roles/auth/storage stand-in in
      # infra/supabase/ci/bootstrap.sql), seeds one private row per table for user A, then proves
      # anon and signed-in user B cannot read or write it, on every table, view and storage bucket.
      # A new table or view that is not classified in infra/supabase/tests/rls_audit.sql fails here.
      - run: psql --version
      - run: scripts/rls-audit.sh

  agents:
    name: managed agents (web unit + skill drift)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
      - name: agent runner, safety, auth, skill drift
        run: pnpm --filter @neo-fm/web exec vitest run tests/agent-runner.test.ts tests/agent-definitions.test.ts tests/agent-auth.test.ts tests/agent-transient.test.ts tests/embed-token.test.ts tests/embed-url.test.ts tests/safety.test.ts tests/lyrics-merge.test.ts
      - name: embedded skill is up to date
        run: |
          node apps/web/scripts/gen-skill.mjs
          git diff --exit-code -- apps/web/lib/agent/skill-pce-poem.ts

  pce-engine:
    name: pce engine + embedder (python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy scipy pytest -r services/embedder/requirements.txt
      - name: engine two-round protocol
        run: python -m pytest -q managed-agents/pce-engine/tests
      - name: embedder token auth
        run: python -m pytest -q services/embedder/tests

  py:
    name: python (uv)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - packages/song-doc/python
          # v2 is cloud-only (Vercel + Supabase + Cloud Run + Claude Managed Agents + Gemini Lyria): the v1 DGX sidecar projects were retired.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: sync project
        working-directory: ${{ matrix.project }}
        run: uv sync --all-groups

      - name: ruff
        working-directory: ${{ matrix.project }}
        run: uv run ruff check .

      - name: mypy
        working-directory: ${{ matrix.project }}
        run: uv run mypy .

      - name: pytest (tests dir required)
        working-directory: ${{ matrix.project }}
        run: |
          if [ ! -d tests ]; then
            echo "::error::missing tests/ in ${{ matrix.project }} — every Python project must ship tests"
            exit 1
          fi
          uv run pytest -q

  contracts:
    name: contracts (queue + openapi)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install validators
        run: |
          python -m pip install --upgrade pip
          pip install jsonschema openapi-spec-validator

      - name: validate queue-message JSON Schema
        run: |
          python -c "import json, jsonschema; jsonschema.Draft202012Validator.check_schema(json.load(open('docs/contracts/queue-message.schema.json'))); print('queue-message ok')"

      - name: validate OpenAPI cloud + dgx
        run: |
          openapi-spec-validator docs/contracts/openapi-cloud.yaml

  song-doc-codegen:
    name: song-doc codegen drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pnpm install --frozen-lockfile=false

      - name: re-export song-doc JSON Schema from Zod
        run: pnpm --filter @neo-fm/song-doc export-schema

      - name: re-run Python codegen
        run: python3 scripts/song-doc-codegen.py

      - name: fail on drift
        run: |
          if ! git diff --exit-code -- \
              packages/song-doc/song-doc.schema.json \
              packages/song-doc/python/neo_fm_song_doc/_generated.py; then
            echo "::error::song-doc codegen out of date. Run:"
            echo "  pnpm --filter @neo-fm/song-doc export-schema"
            echo "  python3 scripts/song-doc-codegen.py"
            echo "...and commit the regenerated files."
            exit 1
          fi

      - name: install uv (for python parity dump)
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: sync song-doc python project
        working-directory: packages/song-doc/python
        run: uv sync --all-groups

      - name: dump TS parity stream
        run: pnpm --filter @neo-fm/song-doc --silent normalize-fixtures > /tmp/ts-parity.txt

      - name: dump Python parity stream
        working-directory: packages/song-doc/python
        run: uv run python tests/parity_dump.py > /tmp/py-parity.txt

      - name: fixture parity (TS == Py byte-identical)
        run: |
          if ! diff -u /tmp/ts-parity.txt /tmp/py-parity.txt; then
            echo "::error::Zod and pydantic disagree on fixture parsing. See diff above."
            exit 1
          fi
          echo "[song-doc] $(wc -l < /tmp/ts-parity.txt) fixtures parsed identically by TS and Py"
